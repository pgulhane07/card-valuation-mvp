# Optional local PostgreSQL for a quick demo, not production configuration.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: carddemo
      POSTGRES_PASSWORD: carddemo
      POSTGRES_DB: card_valuation
    ports:
      - "5433:5432"
    volumes:
      - card_demo_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U carddemo -d card_valuation"]
      interval: 3s
      timeout: 3s
      retries: 15
volumes:
  card_demo_pgdata:
